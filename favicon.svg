<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Digital Ops Systems">
  <rect width="64" height="64" rx="14" fill="#0D1B2A"/>
  <!-- grid dots (subtle) -->
  <g fill="#C9A84C" opacity="0.14">
    <circle cx="21" cy="21" r="1.6"/><circle cx="32" cy="21" r="1.6"/><circle cx="43" cy="21" r="1.6"/>
    <circle cx="21" cy="32" r="1.6"/><circle cx="32" cy="32" r="1.6"/><circle cx="43" cy="32" r="1.6"/>
    <circle cx="21" cy="43" r="1.6"/><circle cx="32" cy="43" r="1.6"/><circle cx="43" cy="43" r="1.6"/>
  </g>
  <!-- path mark: gold origin node -> right -> down -->
  <line x1="21" y1="21" x2="43" y2="21" stroke="#C9A84C" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="43" y1="21" x2="43" y2="43" stroke="#E9EFF5" stroke-width="4.5" stroke-linecap="round"/>
